services:
  # Backend API Web Service
  - type: web
    name: water-supply-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: water-supply-frontend
          property: url
      - key: DEMO_OTP_ENABLED
        value: "true"
      - key: DEMO_OTP_PHONES
        value: "9111111111,9222222222,9333333333,9444444444,9555555555,7777777777,6291909839,8111111111,8222222222,8888888888,2222222222,3333333333,9999999999,*"

  # Frontend Static Site
  - type: web
    name: water-supply-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: water-supply-backend
          property: url
          append: /api/v1
